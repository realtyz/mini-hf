[project]
name = "ms-server"
version = "0.1.0"
description = "ModelScope-compatible API server for hub client integration (port 9802)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "realtyz", email = "realtyz@outlook.com" }]
dependencies = ["core", "database", "storage", "fastapi[standard]>=0.133.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_server"]

[tool.uv.sources]
core = { workspace = true }
database = { workspace = true }
storage = { workspace = true }
