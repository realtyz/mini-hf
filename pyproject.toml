# Workspace root configuration
[project]
name = "mini-hf"
version = "0.1.0"
description = "Model cache repository system for Huggingface/Modelscope"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic>=1.18.4", "loguru>=0.7.3", "psycopg2-binary>=2.9.11"]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
