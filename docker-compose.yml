# mini-hf docker-compose
#
# NOTE: S3-compatible storage is NOT included here — see README.md
# "Prerequisites". Configure S3_* in .env to point to your own MinIO/RustFS/S3
# before bringing the stack up.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-hf/backend:${VERSION:-latest}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  mgmt-server:
    image: mini-hf/backend:${VERSION:-latest}
    command: ["uv", "run", "python", "-m", "mgmt_server.main"]
    ports:
      - "9800:9800"
    env_file:
      - .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - REDIS_URL=redis://redis:6379
      - INCOMPLETE_FILE_PATH=/tmp/mini-hf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ${INCOMPLETE_FILE_PATH:-./data/incomplete}:/tmp/mini-hf
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9800/api/v1/health/', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  hf-server:
    image: mini-hf/backend:${VERSION:-latest}
    command: ["uv", "run", "python", "-m", "hf_server.main"]
    ports:
      - "9801:9801"
    env_file:
      - .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9801/', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # General-purpose worker: accepts tasks of any size.
  worker:
    image: mini-hf/backend:${VERSION:-latest}
    command: ["uv", "run", "python", "-m", "worker.main"]
    env_file:
      - .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - REDIS_URL=redis://redis:6379
      - INCOMPLETE_FILE_PATH=/tmp/mini-hf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ${WORKER_DATA_PATH:-./data/worker}:/tmp/mini-hf
    restart: unless-stopped
    logging: *default-logging
    deploy:
      replicas: 1

  # Small-repo worker: only picks up tasks whose required_storage <= 50 GB.
  # Provides fairness so that large downloads do not starve small repos.
  # Routing is enforced in worker.py via WORKER_MAX_REPO_STORAGE_GB.
  worker-small:
    image: mini-hf/backend:${VERSION:-latest}
    command: ["uv", "run", "python", "-m", "worker.main"]
    env_file:
      - .env
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - REDIS_URL=redis://redis:6379
      - INCOMPLETE_FILE_PATH=/tmp/mini-hf
      - WORKER_MAX_REPO_STORAGE_GB=50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ${WORKER_DATA_PATH:-./data/worker}:/tmp/mini-hf
    restart: unless-stopped
    logging: *default-logging
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mini-hf/frontend:${VERSION:-latest}
    ports:
      - "8080:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-/api/v1}
      - EMAIL_DOMAIN=${EMAIL_DOMAIN:-minihf.com}
      - HF_SERVER_URL=${HF_SERVER_URL:-http://localhost:9801}
    depends_on:
      mgmt-server:
        condition: service_healthy
      hf-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${PG_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-123456}
      - POSTGRES_DB=${PG_DATABASE:-mini_hf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USERNAME:-postgres} -d ${PG_DATABASE:-mini_hf}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
